name: Build macOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Eukolia
        run: npm run build

      - name: Verify Electron build output
        run: |
          echo "=== dist-electron ==="
          find dist-electron -maxdepth 2 -type f -print
          test -f dist-electron/main.js
          test -f dist-electron/preload.cjs

      - name: Build macOS app
        run: npx electron-builder --mac dir dmg --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: release/*.dmg